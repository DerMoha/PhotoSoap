<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PhotoSoap</title>
  <style>
    :root { font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d1d1f; background: #f5f5f7; }
    body { margin: 0; padding: 48px 20px; }
    main { max-width: 720px; margin: auto; padding: 40px; border-radius: 24px; background: #fff; box-shadow: 0 16px 50px #00000012; }
    h1 { margin-top: 0; font-size: 2.4rem; line-height: 1.1; }
    a { color: #0677e8; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    nav a { padding: 10px 16px; border-radius: 999px; background: #eef5ff; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { :root { color: #f5f5f7; background: #111; } main { background: #1c1c1e; } nav a { background: #15263d; } }
  </style>
</head>
<body>
  <main>
    <h1>PhotoSoap</h1>
    <p>Review your photo library one item at a time, keep what matters, and safely queue the rest for deletion.</p>
    <nav>
      <a href="privacy.html">Privacy Policy</a>
      <a href="support.html">Support</a>
    </nav>
  </main>
</body>
</html>
